<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Choisir le ville</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <h1> 选择城市</h1>
    </header>
    <a href="{{url_for('livreur')}}"><button style=" margin-top: 20px;">返回</button></a>
    <form method="post" action="{{url_for('choisirville')}}">
        {% for insee, nom in message %}
            <input type="radio" name="ville" value="{{ insee }}" style="width: 10%;margin-top: 10px;"> {{insee}}  {{ nom }}  <br>
        {% endfor %}
        <button type="submit">确认</button>
    </form>
</body>
